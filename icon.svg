<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4cb0"/>
      <stop offset="1" stop-color="#26337e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe94d"/>
      <stop offset="1" stop-color="#ffa800"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- The cube stays inside the maskable safe zone (a centred circle of 40% radius) -->
  <g transform="translate(112 112) scale(6)">
    <rect x="2.5" y="2.5" width="43" height="43" rx="3" fill="url(#body)" stroke="#000" stroke-width="3"/>
    <rect x="6" y="6" width="36" height="36" rx="1.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="12" y="13" width="8" height="8" fill="#5ef0ff" stroke="#000" stroke-width="2.5"/>
    <rect x="28" y="13" width="8" height="8" fill="#5ef0ff" stroke="#000" stroke-width="2.5"/>
    <rect x="12" y="28" width="24" height="6" fill="#5ef0ff" stroke="#000" stroke-width="2.5"/>
  </g>
</svg>
