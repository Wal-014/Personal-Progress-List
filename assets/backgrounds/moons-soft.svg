<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 460" opacity=".4">
  <defs>
    <path id="shape" d="M9-37C-14-33-28-17-27 3c1 23 17 36 37 36 14 0 25-6 33-17-15 8-33 5-43-8C-11 0-10-22 9-37Z"/>
    <radialGradient id="fade" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outer" xlink:href="#fade" cx="-25" cy="8" r="17"/>
    <radialGradient id="lower-tip" xlink:href="#fade" cx="35" cy="26" r="15"/>
    <radialGradient id="inner" xlink:href="#fade" cx="-5" cy="-8" r="20"/>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-48" y="-48" width="100" height="100"><feGaussianBlur stdDeviation="2"/></filter>
    <use id="outline" xlink:href="#shape" fill="white" fill-opacity=".13" stroke="white" stroke-opacity=".36" stroke-width="1.5"/>
    <g id="reflection" fill="none">
      <use xlink:href="#shape" stroke-width="4" filter="url(#bloom)"/>
      <use xlink:href="#shape" stroke-width="1.5"/>
    </g>
  </defs>
  <g transform="translate(302 51) rotate(-8) scale(0.82)" stroke-linejoin="round">
    <use xlink:href="#outline"/>
    <use xlink:href="#reflection" stroke="url(#outer)" opacity="0.9"/>
  </g>
  <g transform="translate(601 146) rotate(16) scale(0.64)" stroke-linejoin="round">
    <use xlink:href="#outline"/>
    <use xlink:href="#reflection" stroke="url(#lower-tip)" opacity="0.8"/>
  </g>
  <g transform="translate(143 345) rotate(-14) scale(0.96)" stroke-linejoin="round">
    <use xlink:href="#outline"/>
    <use xlink:href="#reflection" stroke="url(#inner)" opacity="1"/>
  </g>
</svg>
