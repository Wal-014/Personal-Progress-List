<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="glint">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".5" stop-color="white" stop-opacity=".12"/>
      <stop offset=".78" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity=".06"/>
    </linearGradient>
    <filter id="bloom" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <g id="arcs" fill="none">
      <path d="M120 170 Q105 60 228 -20" vector-effect="non-scaling-stroke"/>
      <path d="M670 80 C780 160 930 134 955 -20" vector-effect="non-scaling-stroke"/>
      <path d="M798 820 Q853 709 1020 690" vector-effect="non-scaling-stroke"/>
    </g>
  </defs>
  <use xlink:href="#arcs" stroke="white" opacity=".30" stroke-width="1"/>
  <use xlink:href="#arcs" stroke="url(#glint)" stroke-width="4" opacity=".6" filter="url(#bloom)"/>
  <use xlink:href="#arcs" stroke="url(#glint)" stroke-width="1.25"/>
</svg>
