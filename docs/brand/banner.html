<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      README banner, 1280x640. Render it over HTTP so the fonts load; with a server at the repository root
      (python -m http.server 8000 --bind 127.0.0.1):
        npx -y playwright@1.63.0 screenshot --viewport-size "1280,640" "http://localhost:8000/docs/brand/banner.html" docs/brand/banner.jpg
      It shares brand.css and the app screenshots in docs/brand/card/ with the link preview card.
    -->
    <title>Personal Progress List</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body, #art { width: 1280px; height: 640px; }

      .copy { position: absolute; left: 72px; top: 64px; width: 600px; }
      .brand { font-size: 32px; }
      h1 { margin: 44px 0 0; font-size: 84px; line-height: 1; }
      .lead { margin: 24px 0 0; font: 600 25px/1.35 Inter, sans-serif; color: var(--muted); }
      .features { margin-top: 36px; grid-template-columns: repeat(3, max-content); }
      .features li { font-size: 19px; }
      .url { position: absolute; left: 72px; bottom: 56px; font-size: 22px; }

      .stats { left: 760px; top: 56px; width: 470px; }
      .list { left: 700px; top: 250px; width: 470px; transform: rotate(-2deg); }
    </style>
  </head>
  <body>
    <main id="art">
      <div class="copy">
        <div class="brand"><img src="../../icon.svg" alt="" width="64" height="64" /><span>Personal Progress List</span></div>
        <h1>Every clear <em>counts.</em></h1>
        <p class="lead">Your Geometry Dash journey, ranked your way.</p>
        <ul class="features">
          <li>Attempts</li>
          <li>Play time</li>
          <li>Statistics</li>
        </ul>
      </div>
      <p class="url">wal-014.github.io/Personal-Progress-List</p>
      <figure class="shot stats"><img src="card/stats.jpg" alt="" /></figure>
      <figure class="shot list"><img src="card/list.jpg" alt="" /></figure>
    </main>
  </body>
</html>
