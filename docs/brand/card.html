<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Promotional card and site link preview (og:image in index.html), 1200x630. Render it over HTTP so the fonts load;
      with a server at the repository root (python -m http.server 8000 --bind 127.0.0.1):
        npx -y playwright@1.63.0 screenshot --viewport-size "1200,630" "http://localhost:8000/docs/brand/card.html" docs/brand/card-2.jpg
      Give the output a new name whenever the design changes: chat apps cache previews by URL. Then update og:image in
      index.html, SITE_FILES in scripts/build-site.js and the README.
      The screenshots in docs/brand/card/ are crops of the app at a 1440x900 viewport: the demo profile in English,
      Nebula theme, grid background, after the AREDL sync. Retake them when the screens they show change.
    -->
    <title>Personal Progress List</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body, #art { width: 1200px; height: 630px; }

      .copy { position: absolute; left: 64px; top: 58px; width: 520px; }
      h1 { margin: 34px 0 0; font-size: 58px; line-height: 1.04; }
      .lead { margin: 20px 0 0; font-size: 21px; line-height: 1.45; color: var(--muted); }
      .features { margin-top: 30px; grid-template-columns: repeat(2, max-content); }
      .url { position: absolute; left: 64px; bottom: 50px; }

      .stats { left: 640px; top: 48px; width: 500px; }
      .details { left: 872px; top: 96px; width: 290px; }
      .list { left: 600px; top: 304px; width: 400px; }
    </style>
  </head>
  <body>
    <main id="art">
      <div class="copy">
        <div class="brand"><img src="../../icon.svg" alt="" width="56" height="56" /><span>Personal Progress List</span></div>
        <h1>Track and <em>rank</em> your Geometry Dash clears</h1>
        <p class="lead">Your completed levels in your own order, with attempts, play time, deaths and stats.</p>
        <ul class="features">
          <li>Classic &amp; Platformer lists</li>
          <li>Wishlists</li>
          <li>Statistics &amp; timeline</li>
          <li>Level details</li>
        </ul>
      </div>
      <p class="url">wal-014.github.io/Personal-Progress-List</p>
      <figure class="shot stats"><img src="card/stats.jpg" alt="" /></figure>
      <figure class="shot details"><img src="card/details.jpg" alt="" /></figure>
      <figure class="shot list"><img src="card/list.jpg" alt="" /></figure>
    </main>
  </body>
</html>
