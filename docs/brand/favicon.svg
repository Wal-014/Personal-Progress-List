    <g transform="rotate(20 19 16)">
      <rect x="9" y="6" width="20" height="20" rx="2" stroke="#000" stroke-width="9" />
      <rect x="9" y="6" width="20" height="20" rx="2" stroke="#fff" stroke-width="5" />
    </g>
  </g>
</svg>
