name: CI

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
  # Daily deploy so the site's copy of the community sheet stays current
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a deploy that already started is allowed to finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run lint
      - run: npm test

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0
      - run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: npm run test:db
        env:
          SUPABASE_CLI: supabase

  # Database changes reach production only from main, before the site that may depend on them
  migrate-prod:
    needs: [ci, db]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          source scripts/backup-db-url.sh
          prepare_backup_db_url
          printf '::add-mask::%s\n' "${BACKUP_DB_PASSWORD//%/%25}"
          printf '::add-mask::%s\n' "${SUPABASE_DB_URL//%/%25}"
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  deploy:
    needs: [ci, db, migrate-prod]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build data/levels.json
        env:
          EVENT: ${{ github.event_name }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if ! npm run levels; then
            # Scheduled and manual runs exist to refresh the sheet, so they fail; a code change ships with the live copy
            [ "$EVENT" = push ] || exit 1
            echo "::warning::Community sheet unavailable; deploying the live data/levels.json"
            curl -fsS --retry 3 "$SITE_URL/data/levels.json" -o data/levels.json
          fi
      - run: npm ci
      - run: npm run assets
      - run: npm run site
        env:
          PRODUCTION_RELEASE: "true"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The dev site has no database, so development deploys only the site (scripts/build-site.js)
  deploy-dev:
    needs: [ci, db]
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://ppl-dev.waquermaster.workers.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - name: Build data/levels.json
        run: |
          if ! npm run levels; then
            echo "::warning::Community sheet unavailable; deploying production's data/levels.json"
            curl -fsS --retry 3 https://wal-014.github.io/Personal-Progress-List/data/levels.json -o data/levels.json
          fi
      - run: npm ci
      - run: npm run assets
      - run: npm run site -- development
      # Wrangler comes from the relay's lockfile; workerd's install script is needed only by `wrangler dev`
      - run: npm ci --ignore-scripts
        working-directory: relay
      - run: relay/node_modules/.bin/wrangler deploy --config dev-site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
