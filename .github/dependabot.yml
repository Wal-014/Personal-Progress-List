version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates are checked on the dev site before a release reaches production
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /relay
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
